services:
  - type: web
    name: unotes-web
    runtime: python
    pythonVersion: 3.12.7
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    # Explicit gunicorn invocation to avoid truncated commands on Render
    startCommand: "bash -c 'gunicorn unotes_project.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${WEB_CONCURRENCY:-4} --worker-class sync --timeout 120 --access-logfile -'"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "u-notes.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://u-notes.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_SECURE_CONTENT_TYPE_NOSNIFF
        value: "True"
      - key: DJANGO_SECURE_BROWSER_XSS_FILTER
        value: "True"
      - key: DJANGO_X_FRAME_OPTIONS
        value: "DENY"
    disk:
      - name: data
        mountPath: /var/data
        sizeGB: 10
