{% extends 'notes/base.html' %}

{% block content %}
<h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 dark:text-gray-200 mb-6 sm:mb-8 px-4 sm:px-0">Search Results for "{{ query }}"</h2>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 lg:gap-8">
    {% for note in notes %}
    <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg hover:shadow-xl transition-shadow">
        <a href="{% url 'note_detail' note.pk %}" class="block">
            <h3 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-800 dark:text-gray-200 mb-2">{{ note.title }}</h3>
            <div class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mb-4 prose max-w-none dark:prose-invert line-clamp-3">
                {{ note.content|safe|truncatewords_html:20 }}
            </div>
        </a>
        <div class="flex justify-end items-center gap-3 sm:gap-4">
            <a href="{% url 'note_update' note.pk %}" class="text-blue-500 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-500 text-lg" title="Edit"><i class="fas fa-edit"></i></a>
            <a href="{% url 'note_delete' note.pk %}" class="text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-500 text-lg" title="Delete"><i class="fas fa-trash-alt"></i></a>
        </div>
    </div>
    {% empty %}
    <div class="col-span-full text-center py-8 sm:py-12 px-4">
        <p class="text-gray-500 dark:text-gray-400 text-base sm:text-lg">No results found for your search.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
