{% extends 'notes/base.html' %}

{% block content %}
<div class="bg-white dark:bg-gray-800 p-4 sm:p-6 lg:p-10 rounded-xl shadow-lg w-full max-w-lg mx-auto">
    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200 mb-3 sm:mb-4">Confirm Deletion</h2>
    <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mb-6 sm:mb-8">Are you sure you want to delete the document: <strong>{{ document.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex flex-col sm:flex-row justify-end gap-3 sm:gap-4">
            <a href="{% url 'document_list' %}" class="w-full sm:w-auto text-center px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors">Cancel</a>
            <button type="submit" class="w-full sm:w-auto bg-red-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-red-600 transition-colors">
                <i class="fas fa-trash-alt mr-2"></i>Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
