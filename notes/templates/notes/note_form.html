{% extends 'notes/base.html' %}

{% block content %}
<div class="bg-white dark:bg-gray-800 p-4 sm:p-6 lg:p-10 rounded-xl shadow-lg w-full max-w-2xl mx-auto">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-200 mb-6 sm:mb-8">{% if form.instance.pk %}Edit Note{% else %}Create a New Note{% endif %}</h2>
    <form method="post" class="space-y-4 sm:space-y-6">
        {% csrf_token %}
        <div>
            <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title</label>
            {{ form.title }}
        </div>
        <div>
            <label for="{{ form.topic.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Topic</label>
            {{ form.topic }}
        </div>
        <div>
            <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Content</label>
            {{ form.media }}
            {{ form.content }}
        </div>
        <div>
            <label for="{{ form.tags.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tags</label>
            {{ form.tags }}
        </div>
        <div class="flex flex-col sm:flex-row justify-end gap-3 sm:gap-4 pt-4">
            <a href="{% url 'note_list' %}" class="w-full sm:w-auto text-center px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors">Cancel</a>
            <button type="submit" class="w-full sm:w-auto bg-blue-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-blue-600 transition-colors">
                <i class="fas fa-save mr-2"></i>Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
