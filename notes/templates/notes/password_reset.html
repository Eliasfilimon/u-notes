{% extends 'notes/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-8 sm:py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
            <!-- Header Section -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-4 sm:px-6 pt-8 sm:pt-12 pb-6 sm:pb-8">
                <div class="text-center">
                    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Password Reset</h1>
                    <p class="text-sm sm:text-base text-blue-50">Enter your email to receive a reset link</p>
                </div>
            </div>

            <!-- Form Section -->
            <div class="px-4 sm:px-6 py-6 sm:py-8 space-y-4 sm:space-y-6">
                <form method="post" class="space-y-4 sm:space-y-5">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold py-2 sm:py-3 rounded-lg hover:from-blue-700 hover:to-blue-800 transition duration-200 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-md text-sm sm:text-base">
                        Send Password Reset Email
                    </button>
                </form>
                
                <hr class="border-gray-300 dark:border-gray-600">
                <p class="text-center text-sm sm:text-base">
                    <a href="{% url 'login' %}" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-500 font-semibold">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
