{% extends 'notes/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Password Reset</h2>
                    <p class="text-muted mb-4">Enter your email address to receive a password reset link.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Send Password Reset Email</button>
                    </form>
                    
                    <hr>
                    <p class="text-center mt-3">
                        <a href="{% url 'login' %}">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
