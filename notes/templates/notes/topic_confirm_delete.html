{% extends 'notes/base.html' %}

{% block content %}
<div class="bg-white dark:bg-gray-800 p-4 sm:p-6 lg:p-10 rounded-xl shadow-lg w-full max-w-lg mx-auto text-center">
    <i class="fas fa-exclamation-triangle text-red-500 text-3xl sm:text-4xl mb-3 sm:mb-4"></i>
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-200 mb-3 sm:mb-4">Delete Topic</h2>
    <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mb-6 sm:mb-8 px-2">Are you sure you want to delete the topic "{{ topic.name }}"? This will also delete all associated notes. This action cannot be undone.</p>
    <form method="post" class="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4">
        {% csrf_token %}
        <a href="{% url 'topic_list' %}" class="w-full sm:w-auto bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-gray-200 px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-gray-400 dark:hover:bg-gray-700 transition-colors text-center">Cancel</a>
        <button type="submit" class="w-full sm:w-auto bg-red-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-red-600 transition-colors">
            <i class="fas fa-trash-alt mr-2"></i>Confirm Delete
        </button>
    </form>
</div>
{% endblock %}
