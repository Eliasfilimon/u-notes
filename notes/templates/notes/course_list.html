{% extends 'notes/base.html' %}

{% block content %}
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 sm:mb-8">
    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 dark:text-gray-200">Courses</h2>
    <a href="{% url 'course_create' %}" class="w-full sm:w-auto bg-blue-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-blue-600 transition-colors text-center whitespace-nowrap">
        <i class="fas fa-plus mr-2"></i><span class="hidden sm:inline">New Course</span><span class="sm:hidden">Add Course</span>
    </a>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 lg:gap-8">
    {% for course in courses %}
    <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg hover:shadow-xl transition-shadow">
        <h3 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-800 dark:text-gray-200 mb-2">{{ course.name }}</h3>
        <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400">{{ course.course_code }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-500">{{ course.instructor }}</p>
        <div class="mt-4 sm:mt-6 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
            <a href="{% url 'notes_by_course' course.pk %}" class="text-center sm:text-left text-green-500 dark:text-green-400 hover:text-green-700 dark:hover:text-green-500 font-semibold py-2 sm:py-0">View Notes</a>
            <div class="flex justify-end gap-3 sm:gap-4">
                <a href="{% url 'course_update' course.pk %}" class="text-blue-500 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-500 text-lg" title="Edit"><i class="fas fa-edit"></i></a>
                <a href="{% url 'course_delete' course.pk %}" class="text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-500 text-lg" title="Delete"><i class="fas fa-trash-alt"></i></a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-span-full text-center py-8 sm:py-12 px-4">
        <p class="text-gray-500 dark:text-gray-400 text-base sm:text-lg">No courses found. Add a new course to get started.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
