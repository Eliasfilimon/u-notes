{% extends 'notes/base.html' %}

{% block content %}
<div class="mb-4 sm:mb-6 px-4 sm:px-0">
    <nav class="flex items-center text-xs sm:text-sm text-gray-600 dark:text-gray-400">
        <a href="{% url 'note_list' %}" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <i class="fas fa-home mr-1"></i>Home
        </a>
        <span class="mx-2">/</span>
        <span class="text-gray-500">Profile</span>
    </nav>
</div>
<div class="bg-white dark:bg-gray-800 p-4 sm:p-6 lg:p-10 rounded-xl shadow-lg w-full max-w-2xl mx-auto">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6 sm:mb-8">Profile</h2>
    <form method="post" class="space-y-4 sm:space-y-6">
        {% csrf_token %}
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Username</label>
            {{ form.username }}
        </div>
        <div>
            <label for="{{ form.first_name.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
            {{ form.first_name }}
        </div>
        <div>
            <label for="{{ form.last_name.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
            {{ form.last_name }}
        </div>
        <div>
            <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
            {{ form.email }}
        </div>
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 sm:gap-4 pt-4">
            <a href="{% url 'note_list' %}" class="w-full sm:w-auto text-center bg-gray-500 dark:bg-gray-600 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-gray-600 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
            <button type="submit" class="w-full sm:w-auto bg-blue-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg shadow-md hover:bg-blue-600 transition-colors">
                <i class="fas fa-save mr-2"></i>Update Profile
            </button>
        </div>
    </form>
</div>
{% endblock %}
